name: Churn Shield CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/churn_shield?schema=public
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: Churn Shield <ci@example.com>
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type-check
        run: npm run typecheck

      - name: Build application
        run: npm run build
